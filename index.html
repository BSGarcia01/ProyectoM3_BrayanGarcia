<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat M3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <a href="/">Inicio</a>
        <a href="/chat">Chatear</a>
        <a href="/about">Sobre</a>
    </nav>

    <div class="container">
        <h1>Mi Chat Simple</h1>

        <div class="chat-area" id="messages">

        </div>

        <form id="message-form" class="form-container">
            <input type="text" id="message-input" placeholder="Escribe un mensaje..." required>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('message-form');
            const input = document.getElementById('message-input');
            const messagesDiv = document.getElementById('messages');

            async function loadMessages() {
                const response = await fetch('/api');
                const data = await response.json();
                messagesDiv.innerHTML = '';
                data.forEach(msg => {
                    const div = document.createElement('div');
                    div.classList.add('message');
                    div.classList.add(msg.tipo === 'ai' ? 'ai' : 'user');
                    div.textContent = msg.mensaje;
                    messagesDiv.appendChild(div);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            loadMessages();

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const texto = input.value;
                await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto })
                });
                input.value = '';
                loadMessages();
            });
        });
    </script>
</body>
</html>
