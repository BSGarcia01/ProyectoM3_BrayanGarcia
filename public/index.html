<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat M3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <nav style="background: #333; color: white; padding: 10px; text-align: center;">
        <a href="/" style="color: white; margin: 0 15px; text-decoration: none;">Home</a>
        <a href="/chat" style="color: white; margin: 0 15px; text-decoration: none;">Chat</a>
        <a href="/about" style="color: white; margin: 0 15px; text-decoration: none;">About</a>
    </nav>
    
    <div class="container">
        <h1>Mi Chat</h1>
        
        <div class="chat-area" id="messages">
           
        </div>

        <form id="message-form">
            <input type="text" id="message-input" placeholder="Escribe un mensaje..." required>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('message-form');
            const input = document.getElementById('message-input');
            const messagesDiv = document.getElementById('messages');

            
            function renderMensajes(historial) {
                messagesDiv.innerHTML = '';
                
                const lista = Array.isArray(historial) ? historial : (historial.historial || []);
                
                lista.forEach(msg => {
                    const div = document.createElement('div');
                    div.classList.add('message');
                    div.classList.add(msg.tipo === 'ai' ? 'ai' : 'user');
                    div.textContent = msg.mensaje;
                    messagesDiv.appendChild(div);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            
            async function loadMessages() {
                const response = await fetch('/api');
                const data = await response.json();
                renderMensajes(data);
            }

           
            loadMessages();

           
            form.addEventListener('submit', async (e) => { 
                e.preventDefault();
                const texto = input.value;
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto })
                });
                const data = await response.json();
                input.value = '';
                renderMensajes(data.historial || data);
            });
        });
    </script>
</body>
</html>
